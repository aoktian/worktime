<div class="modal-dialog modal-xl">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">#{{.comment.Id}} 日志</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">

{{range $index, $log := .logs}}
<div class="card mb-3">
    <div class="card-header">
        <i>{{$log.Operator}}
        ({{formatDate $log.CreatedAt}})</i>
    </div>

    <div class="card-body">
        {{$log.Content | html}}
    </div>
</div>
{{end}}

<div class="card mb-3">
    <div class="card-header d-flex align-items-center">
        <span class="badge text-bg-danger me-2">最新</span>
        <i>{{.comment.Editor}}
        ({{formatDate .comment.CreatedAt}})</i>
    </div>

    <div class="card-body">
        {{.comment.Content | html}}
    </div>
</div>

        </div>
    </div>
</div>
