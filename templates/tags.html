{{template "header.html" .}}
<link rel="stylesheet" href="/static/jQuery.Gantt/css/style.css?t=20251016">
<style type="text/css">
.fn-gantt .leftPanel {
    width: 680px;
}

.rightPanel .fn-label {
    width: 100%;
}

.fn-gantt .leftPanel .bg-primary
, .fn-gantt .leftPanel .bg-secondary
, .fn-gantt .leftPanel .bg-danger
{
    color: #fff;
}
.fn-gantt .leftPanel .desc .bg-warning {
    color: #000;
}
.fn-gantt .leftPanel .desc a{
    color: #000;
}


</style>

</head><body>

{{template "nav.html" (dict "navtab" "manage" "authUser" .authUser )}}

<div class="container-fluid">

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
<li class="breadcrumb-item"><a href="/project/list#project-{{.project.Id}}">项目管理</a></li>
<li class="breadcrumb-item active" aria-current="page">{{.project.Name}}</li>
    </ol>
</nav>
<hr />
</div>

<div class="container-fluid mb-3" id="searchform">
    <div class="row row-cols-lg-auto g-3 align-items-center">

<div class="col-12"><div class="input-group">
    <span class="input-group-text">状态</span>
    <select vtype="int" itag="val" name="search_state"
        class="form-select"
        onchange="_page( 1 );"
    >
<option value="0">正常</option>
<option value="1">归档</option>
<option value="-1">全部</option>
    </select>
</div></div>

<div class="col-12"><div class="input-group">
    <span class="input-group-text">项目</span>
    <select vtype="int" itag="val" name="project_id"
        class="form-select"
        onchange="_page( 1 );"
    >
        <option value="0">全部</option>
{{template "selection_map.html" (dict "values" .projects "selected" 0) }}
    </select>
</div></div>

<div class="col-12"><div class="input-group">
    <span class="input-group-text">名字</span>
    <input itag="val" name="name"
        type="text"
        class="form-control"
    />
</div></div>

<div class="col-12"><div class="input-group">
    <span class="input-group-text">时间</span>
    <input vtype="date2unix" itag="val" name="created_at0"
        type="date"
        class="form-control"
    />
    <input vtype="date2unix" itag="val" name="created_at9"
        type="date"
        class="form-control"
    />
</div></div>


<div class="col-12">
    <button class="btn btn-primary me-2" onclick="_page(1);">查询</button>
</div>


    </div>
</div>

<div class="container-fluid" id="data-table">
{{template "tags-content.html" .}}
</div>


{{template "footer.html" .}}
<script type="text/javascript">
var _project_id = {{.project.Id}};
function _modify(id) {
    ajax("/tag/modify/" + id)
}
function _del(id) {
    $.confirm({
        theme: "bootstrap",
        title: "删除版本",
        content: "确定要删除吗？",
        buttons: {
            cancel: {
                text: '取消',
                action: function () {
                }
            },
            confirm: {
                text: '确定',
                btnClass: 'btn-danger',
                action: function () {
                    var data = {}
                    ajax("/tag/delete/" + id, data, function(r) {
                        _page();
                        showSuccessToast("删除成功");
                    })
                }
            }
        }
    });
}
function _commit() {
    var data = getFormData("#edit-tag-form")
    data.project_id = _project_id;

    data.start_at = new Date(data.start_at).getTime() / 1000;
    data.end_at = new Date(data.end_at).getTime() / 1000;

    ajax("/tag/save", data, function(r) {
        _page()
        $("#dialog").modal("hide");
        showSuccessToast("保存成功");
    })
}

var _currentPage = 1;
function _page(n) {
    if (n) {
        _currentPage = n;
    }
    const data = getFormData("#searchform");
    data.page = _currentPage;
    ajax("/tag/search", data)
}

</script>

<div class="modal" id="dialog-tag-gantt" tabindex="-1" aria-hidden="true">
<div class="modal-dialog modal-fullscreen">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">甘特图</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body d-flex justify-content-center">
<div class="gantt" id="tag-gantt"></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button></div>
    </div>
</div>
</div>


<script src="/static/jQuery.Gantt/js/jquery.fn.gantt.js?t=20251016"></script>
<script type="text/javascript">
function _show_gantt(tag_id) {
    ajax("/tag/gantt/"+tag_id, {}, function(r) {
        $("#dialog-tag-gantt").modal('show');
        $("#tag-gantt").gantt({
            source: r.source,
            months : ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"],
            dow : ["日", "一", "二", "三", "四", "五", "六"],
            itemsPerPage : 100000,
            scale: "days",
            minScale: "days",
            maxScale:"months",
            navigate: "scroll",
            waitText: "加载中...",
            scrollToToday: true,
            onRender: function() {
                $("#spacer").html("任务总数：" + r.source.length)
            }
        });
    })
}
</script>

</body></html>
