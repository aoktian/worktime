<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">编辑版本</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
<div class="modal-body" id="edit-tag-form">
    <input vtype="int" type="hidden" name="id" value="{{.tag.Id}}" />

<div class="row mb-2">
    <label class="col-sm-4 col-form-label">输入名称</label>
    <div class="col-sm-8">
<input class="form-control" type="text"
        value="{{.tag.Name}}"
        name="name"
    />
    </div>
</div>
<div class="form-text text-danger">建议名字不要超过5个字。</div>

<div class="row mb-2">
    <label class="col-sm-4 col-form-label">选择版本</label>
    <div class="col-sm-8">
<select id="edit-tag-project" itag="val" vtype="int" name="project_id" class="form-select">
<option value="{{.project.Id}}" selected>{{.project.Name}}</option>
</select>
    </div>
</div>

<div class="row mb-2">
    <label class="col-sm-4 col-form-label">排序</label>
    <div class="col-sm-8">
    <input class="form-control" type="number"
        value="{{.tag.Paixu}}"
        name="paixu" vtype="int"
    />
    </div>
</div>

<div class="row mb-2">
    <label class="col-sm-4 col-form-label">归档</label>
    <div class="col-sm-8">
    <select vtype="bool" name="is_archived"
        class="form-select"
    >
        <option value="0" {{if eq .tag.IsArchived false}}selected{{end}}>否</option>
        <option value="1" {{if eq .tag.IsArchived true}}selected{{end}}>是</option>
    </select>
    </div>
</div>

<div class="row mb-2">
    <label class="col-sm-4 col-form-label">开始时间</label>
    <div class="col-sm-8">
    <input vtype="date2unix" class="form-control" type="date"
        value="{{.tag.StartAt | unixToDay}}"
        name="start_at"
    />
    </div>
</div>
<div class="row mb-2">
    <label class="col-sm-4 col-form-label">结束时间</label>
    <div class="col-sm-8">
    <input vtype="date2unix" class="form-control" type="date"
        value="{{.tag.EndAt | unixToDay}}"
        name="end_at"
    />
    </div>
</div>

</div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            <button onclick="_committag()" type="button" class="btn btn-primary">保存</button>
        </div>
    </div>
</div>
<script type="text/javascript">
$(document).ready(function() {
    initProjectSelect2("#edit-tag-project", false, false)
})
</script>
