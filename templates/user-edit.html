<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">编辑成员</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="user-edit-form">
<input vtype="int" type="hidden" name="id" value="{{.user.Id}}" />

<div class="row g-3">

<div class="col-md-4">
    <label class="form-label">帐号</label>
    <input name="account" value="{{.user.Account}}" class="form-control" type="text"  />
</div>

<div class="col-md-4">
    <label class="form-label">姓名</label>
    <input name="name" value="{{.user.Name}}" class="form-control" type="text"  />
</div>

<div class="col-md-4">
    <label class="form-label">花名</label>
    <input name="nick" value="{{.user.Nick}}" class="form-control" type="text"  />
</div>

<div class="col-md-4">
    <label class="form-label">部门</label>
    <select vtype="int" name="department"
        class="form-select"
        value="{{.user.Department}}"
    >
        <option value="0">部门</option>
{{template "selection_map.html" (dict "values" .departments "selected" .user.Department) }}
    </select>
</div>

<div class="col-md-4">
    <label class="form-label">工作组</label>
    <input vtype="int" name="team" value="{{.user.Team}}" class="form-control" type="number"  />
</div>

<div class="col-md-4">
    <label class="form-label">状态</label>
    <select vtype="bool" name="is_leave"
        class="form-select"
    >
<option value="0" {{if eq .tag.IsLeave false}}selected{{end}}>正常</option>
<option value="1" {{if eq .tag.IsLeave true}}selected{{end}}>离职</option>
    </select>
</div>

<div class="col-md-12">
    <label class="form-label">权限组</label>
    <select id="ps_group" name="ps_group" multiple class="form-select select2-multiple">
        {{range $key, $value := .psGroups}}
        <option value="{{$value.Id}}" {{if inIntSlice $value.Id $.user.PsGroup}}selected{{end}}>{{$value.Name}}</option>
        {{end}}
    </select>
</div>



</div>

        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            <button onclick="_commit()" type="button" class="btn btn-primary">保存</button>
        </div>
    </div>
</div>

<!-- 初始化脚本 -->
<script>
$('#ps_group').select2({
    theme: "bootstrap-5",
    placeholder: "请选择权限组",
    closeOnSelect: false,
    language: "zh-CN"
});
</script>
