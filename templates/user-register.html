<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">注册</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="user-edit-form">
<input vtype="int" type="hidden" name="id" value="0" />

<div class="row g-3">

<div class="col-md-4">
    <label class="form-label">帐号</label>
    <input name="account" class="form-control" type="text"  />
</div>

<div class="col-md-4">
    <label class="form-label">姓名</label>
    <input name="name" class="form-control" type="text"  />
</div>

<div class="col-md-4">
    <label class="form-label">花名</label>
    <input name="nick" class="form-control" type="text"  />
</div>

<div class="col-md-12">
    <label class="form-label">部门</label>
    <select vtype="int" name="department"
        class="form-select"
    >
        <option value="0">部门</option>
{{template "selection_map.html" (dict "values" .departments "selected" 0) }}
    </select>
</div>

<div class="col-md-4">
    <label class="form-label">密码</label>
    <input name="password" class="form-control" type="text"  />
</div>

</div>

        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            <button onclick='ajax("/auth/register", getFormData("#user-edit-form"), function() {$("#dialog").modal("hide")})' type="button" class="btn btn-primary">提交</button>
        </div>
    </div>
</div>
