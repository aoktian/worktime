# 修改id对已经存在的数据，有影响，要注意同步修改数据库的数据

- id: 10
  name: 未通过
- id: 11
  name: 正在做
- id: 12
  name: 新任务

- id: 20
  name: 等待 #依赖其他任务的完成情况。比如，需要等待策划设计，需要等待美术出图等等

- id: 50
  name: 待定  #待定也是一种解决。如果一直处于待定状态，说明已经不需要处理了。下一步就可以转成【已解决】或者【废弃】
- id: 51
  name: 已解决 #比如程序已经完成，已经提交Dev分支，可标已经解决，下一步是转到验收。如果不需要验收，可以直接标可测试

- id: 60
  name: 可测试 #测试人员测试
- id: 65
  name: 已通过

# 90 以上算是完成状态，会计入完成，进行统计
- id: 98
  name: 完成

- id: 99
  name: 废弃