# 修改id对已经存在的数据，有影响，要注意同步修改数据库的数据
# 状态ID具有排序的功能

- id: 100
  name: 未通过

- id: 200
  name: 正在做
- id: 210
  name: 新任务
- id: 220
  name: 挂起 #依赖其他任务的完成情况。比如，需要等待策划设计，需要等待美术出图等等
- id: 230
  name: 待定 #待定也是一种解决。和挂起很像，但是不一样。如果一直处于待定状态，说明已经不需要处理了。下一步就可以转入完成状态了
- id: 290
  name: 已解决 #比如程序已经完成，已经提交Dev分支，可标已经解决，下一步是转到验收。如果不需要验收，可以直接标可测试

- id: 500
  name: 验收中
- id: 510
  name: 可验收

- id: 600
  name: 测试中
- id: 610
  name: 可测试

- id: 800
  name: 已通过

- id: 970
  name: 废弃
  color: "status-drop"

- id: 999
  name: 完成
  color: "status-done"
